<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Votesense | Strategic Intelligence Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { --aiadmk: #008444; --dmk: #ed1c24; --primary: #002366; --bg: #f8fafc; }
    body { font-family: 'Inter', sans-serif; margin: 0; background: var(--bg); color: #1e293b; }
    header { background: linear-gradient(135deg, var(--primary) 0%, #004aad 100%); color: white; padding: 40px 20px; text-align: center; border-bottom: 6px solid var(--aiadmk); }
    .founder-img { width: 100px; height: 100px; border-radius: 50%; border: 4px solid white; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .controls { background: white; padding: 25px; margin: -30px 20px 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
    select, button, input { padding: 12px 18px; margin: 8px; border-radius: 10px; border: 1px solid #e2e8f0; font-size: 14px; }
    button { background: var(--primary); color: white; border: none; font-weight: 700; cursor: pointer; }
    #searchBox { width: 60%; border: 2px solid var(--primary); font-size: 16px; }
    .radio-container { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin: 20px; }
    .radio-container label { background: #fff; border: 1px solid #cbd5e1; color: #64748b; padding: 12px 24px; border-radius: 30px; cursor: pointer; font-weight: 600; transition: 0.2s; }
    .radio-container input:checked + label { background: var(--primary); color: white; box-shadow: 0 4px 8px rgba(0,35,102,0.3); }
    .table-container { margin: 20px; background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    table { width: 100%; border-collapse: collapse; min-width: 1000px; }
    th { background: var(--primary); color: white; font-size: 13px; padding: 18px; text-align: left; font-weight: 800; border: 1px solid #ffffff33; text-transform: uppercase; }
    td { padding: 15px; border: 1px solid #f1f5f9; font-size: 14px; vertical-align: top; }
    .bold-col { font-weight: 900; color: #0f172a; background: #f1f5f9; border-left: 2px solid #cbd5e1; border-right: 2px solid #cbd5e1; }
    .ps-header { background: #004aad !important; }
    .win-tag { padding: 4px 10px; border-radius: 6px; font-weight: 700; font-size: 11px; }
    .win-AIADMK { background: #dcfce7; color: #166534; } .win-DMK { background: #fee2e2; color: #991b1b; }
    .candidate-sub { font-size: 10px; display: block; color: #cbd5e1; margin-top: 4px; font-weight: 400; }
  </style>
</head>
<body>
<header>
  <img src="founder.jpg" class="founder-img" alt="Founder">
  <h1>Votesense Strategic Dashboard</h1>
  <p>Political Intelligence & Booth-Level Analysis</p>
</header>
<div class="controls">
  <select id="year"><option value="2021">2021 Election</option></select>
  <select id="type"><option value="Assembly Election">Assembly Election</option></select>
  <select id="constituency"><option value="Pappireddipatti">Pappireddipatti</option></select>
  <button onclick="loadDashboard()">GENERATE REPORT</button>
  <input type="text" id="searchBox" onkeyup="searchTable()" placeholder="🔍 Search PS No, Village, or Candidate...">
</div>
<div id="tab-container" class="radio-container"></div>
<div id="display-area" class="table-container"></div>
<script>
  let activeWorkbook = null;
  function loadDashboard() {
    const path = `data/2021_Assembly Election_Pappireddipatti.xlsx`;
    fetch(path).then(res => res.arrayBuffer()).then(buffer => {
      activeWorkbook = XLSX.read(buffer, { type: "array" });
      createTabs(activeWorkbook);
    });
  }
  function createTabs(wb) {
    const container = document.getElementById("tab-container");
    container.innerHTML = "";
    wb.SheetNames.forEach((name, i) => {
      const radio = document.createElement("input");
      radio.type = "radio"; radio.name = "sheet-tab"; radio.id = `tab-${i}`;
      radio.checked = i === 0;
      radio.onclick = () => renderSheet(name);
      const label = document.createElement("label");
      label.htmlFor = `tab-${i}`; label.textContent = name;
      container.appendChild(radio); container.appendChild(label);
    });
    renderSheet(wb.SheetNames[0]);
  }
  function renderSheet(name) {
    const ws = activeWorkbook.Sheets[name];
    const displayArea = document.getElementById("display-area");
    const data = XLSX.utils.sheet_to_json(ws, {header: 1});
    if (data.length === 0) return;
    let html = "<table><thead><tr>";
    data[0].forEach((cell, idx) => {
      let title = cell || "";
      let extraClass = (idx === 0) ? 'class="ps-header"' : '';
      if(title === "AIADMK") title += '<span class="candidate-sub">A. Govindasamy</span>';
      if(title === "DMK") title += '<span class="candidate-sub">M. Prabhu Rajkumar</span>';
      html += `<th ${extraClass}>${title}</th>`;
    });
    html += "</tr></thead><tbody>";
    for(let i=1; i<data.length; i++) {
      html += "<tr>";
      data[i].forEach((cell, j) => {
        let className = (j === 0 || j === 2 || j === 3) ? 'class="bold-col"' : '';
        let val = cell || "";
        if(val === "AIADMK") val = '<span class="win-tag win-AIADMK">AIADMK</span>';
        if(val === "DMK") val = '<span class="win-tag win-DMK">DMK</span>';
        html += `<td ${className}>${val}</td>`;
      });
      html += "</tr>";
    }
    html += "</tbody></table>";
    displayArea.innerHTML = html;
    const table = document.querySelector("table");
    if(table) table.id = "mainTable";
  }
  function searchTable() {
    const query = document.getElementById("searchBox").value.toLowerCase();
    const rows = document.querySelectorAll("#mainTable tr");
    rows.forEach((row, i) => { if (i !== 0) row.style.display = row.innerText.toLowerCase().includes(query) ? "" : "none"; });
  }
</script>
</body>
</html>
