<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Votesense Strategic Command Center</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { --aiadmk: #008444; --dmk: #ed1c24; --primary: #002366; --bg: #f0f4f8; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: var(--bg); color: #1e293b; }
    header { background: linear-gradient(135deg, var(--primary) 0%, #004aad 100%); color: white; padding: 35px 20px; text-align: center; border-bottom: 5px solid var(--aiadmk); }
    .founder-img { width: 90px; height: 90px; border-radius: 50%; border: 3px solid white; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    
    /* Strategic Navigation */
    .nav-bar { background: white; padding: 20px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 1000; }
    .btn { padding: 12px 24px; margin: 5px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; color: white; }
    .btn-primary { background: var(--primary); }
    .btn-master { background: #0ea5e9; }
    .btn-home { background: #64748b; }
    .btn:hover { transform: translateY(-2px); opacity: 0.9; }

    /* Filters & Search */
    .filters { padding: 15px; text-align: center; background: #fff; border-bottom: 1px solid #e2e8f0; }
    select, input { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; margin: 5px; font-size: 14px; }
    #searchBox { width: 50%; border: 2px solid var(--primary); }

    /* Tab Controls */
    .tabs { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; padding: 15px; }
    .tabs label { background: #fff; border: 1.5px solid #cbd5e1; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 600; }
    .tabs input { display: none; }
    .tabs input:checked + label { background: var(--primary); color: white; border-color: var(--primary); }

    /* The Data Table */
    .content-area { margin: 20px; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    table { width: 100%; border-collapse: collapse; min-width: 1100px; }
    th { background: var(--primary); color: white; padding: 15px; font-size: 12px; text-transform: uppercase; border: 1px solid #ffffff22; }
    td { padding: 12px; border: 1px solid #f1f5f9; font-size: 13px; text-align: center; }

    /* Strategic Coloring */
    .col-aiadmk { background: #f0fdf4 !important; font-weight: 800; color: var(--aiadmk); border-left: 3px solid var(--aiadmk) !important; }
    .col-dmk { background: #fef2f2 !important; font-weight: 800; color: var(--dmk); border-left: 3px solid var(--dmk) !important; }
    .col-ps { background: #f8fafc; font-weight: 800; color: var(--primary); }
    
    /* Comparison Charts */
    .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 25px; }
    .chart-container { background: #fff; padding: 15px; border-radius: 10px; border: 1px solid #e2e8f0; }
  </style>
</head>
<body>

<header>
  <img src="founder.jpg" class="founder-img" alt="Founder">
  <h1>Votesense Strategic Command Center</h1>
</header>

<div class="nav-bar">
  <select id="year"><option value="2021">2021 Election</option></select>
  <select id="constituency"><option value="Pappireddipatti">Pappireddipatti</option></select>
  <button class="btn btn-primary" onclick="loadData('report')">VIEW REPORT</button>
  <button class="btn btn-master" onclick="loadData('master')">MASTER DATA</button>
  <button class="btn btn-home" onclick="location.reload()">HOME</button>
  <br>
  <input type="text" id="searchBox" onkeyup="searchTable()" placeholder="🔍 Instant Search Village or Booth...">
</div>

<div id="tab-container" class="tabs"></div>
<div id="display-area" class="content-area">
  <p style="text-align:center; padding: 80px; color: #94a3b8;">Welcome, Balaji. Accessing political intelligence... Please select a report.</p>
</div>

<script>
  let currentWb = null;

  function loadData(type) {
    const path = type === 'master' ? 'data/Master_Data.xlsx' : 'data/2021_Assembly Election_Pappireddipatti.xlsx';
    fetch(path).then(res => res.arrayBuffer()).then(buffer => {
      currentWb = XLSX.read(buffer, { type: "array" });
      renderTabs(currentWb);
    });
  }

  function renderTabs(wb) {
    const container = document.getElementById("tab-container");
    container.innerHTML = "";
    wb.SheetNames.forEach((name, i) => {
      container.innerHTML += `<input type="radio" name="t" id="t${i}" ${i==0?'checked':''} onclick="showSheet('${name}')"><label for="t${i}">${name}</label>`;
    });
    showSheet(wb.SheetNames[0]);
  }

  function showSheet(name) {
    const ws = currentWb.Sheets[name];
    const area = document.getElementById("display-area");
    if (name.includes("Insights")) {
      area.innerHTML = `
        <div class="chart-grid">
          <div class="chart-container"><canvas id="pieChart"></canvas></div>
          <div class="chart-container"><canvas id="barChart"></canvas></div>
        </div>
      `;
      drawCharts();
    } else {
      const data = XLSX.utils.sheet_to_json(ws, {header: 1});
      let html = "<table><thead><tr>";
      data[0].forEach(c => html += `<th>${c||''}</th>`);
      html += "</tr></thead><tbody>";
      for(let i=1; i<data.length; i++) {
        html += "<tr>";
        data[i].forEach((cell, j) => {
          let cls = (j === 0) ? 'class="col-ps"' : (j === 2) ? 'class="col-aiadmk"' : (j === 3) ? 'class="col-dmk"' : '';
          html += `<td ${cls}>${cell||''}</td>`;
        });
        html += "</tr>";
      }
      area.innerHTML = html + "</tbody></table>";
      document.querySelector("table").id = "mainTable";
    }
  }

  function drawCharts() {
    new Chart(document.getElementById('pieChart'), {
      type: 'pie',
      data: { labels: ['AIADMK', 'DMK', 'Others'], datasets: [{ data: [113397, 75831, 27207], backgroundColor: ['#008444', '#ed1c24', '#64748b'] }] },
      options: { plugins: { title: { display: true, text: 'Constituency Vote Share' } } }
    });
    new Chart(document.getElementById('barChart'), {
      type: 'bar',
      data: { labels: ['AIADMK', 'DMK'], datasets: [{ label: 'Total Votes', data: [113397, 75831], backgroundColor: ['#008444', '#ed1c24'] }] },
      options: { plugins: { title: { display: true, text: 'Direct Comparison: ADMK vs DMK' } } }
    });
  }

  function searchTable() {
    const q = document.getElementById("searchBox").value.toLowerCase();
    const rows = document.querySelectorAll("#mainTable tr");
    rows.forEach((r, i) => { if(i>0) r.style.display = r.innerText.toLowerCase().includes(q) ? "" : "none"; });
  }
</script>
</body>
</html>
